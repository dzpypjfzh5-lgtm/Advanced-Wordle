<html lang="en">

<meta name="theme-color" content="#1a1713" media="(prefers-color-scheme: dark)">

<title>Set Down This</title>

<!-- Add to Home Screen. Safari needs a real PNG at a real URL here — it does
     not accept a data: URI — so this is the one companion file. Keep it beside
     index.html when hosting; the game itself runs fine without it. -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  /* No web font is loaded: the display face is a system serif stack, so the
     whole game stays one self-contained file with nothing to fetch and no
     font-swap flash. Works offline, forever. */
  :root {
    /* ---- Paper and ink: warm cream stock, soft charcoal, muted plant dyes ---- */
    --hair: #ddd4c2;          /* hairline borders */
    --hair-strong: #c3b8a2;   /* borders that need to read as deliberate */
    --sage: #6f8065;
    --clay: #b08464;
    --ochre: #cba669;
    --slate: #6f7b86;

    --bg: #efe9dd;
    --bg-2: #e8e1d2;
    --card: #faf7f0;
    --card-2: #f5f1e7;
    --text: #3a352d;
    --muted: #857b6a;
    --title: #4a4237;
    --subtitle: #8a8070;

    --cell-border: #ded5c4;
    --cell-border-filled: #b7ab93;
    --cell-bg: #fdfbf6;
    --cell-text: #3a352d;

    --key-bg: #f2ede2;
    --key-bg-hover: #e9e2d3;
    --key-text: #3a352d;

    --correct: #6f8065;
    --present: #cba669;
    --absent: #8d8474;
    --on-correct: #fbf9f4;
    --on-present: #2f2a22;
    --on-absent: #fbf9f4;

    --line: 1px;
    --shadow-sm: 0 1px 2px rgba(58, 53, 45, 0.06);
    --shadow: 0 10px 30px rgba(58, 53, 45, 0.09);
    --shadow-lift: 0 14px 40px rgba(58, 53, 45, 0.14);
    --modal-overlay: rgba(58, 53, 45, 0.32);
    --modal-bg: #faf7f0;
    --bar-bg: #eae3d5;
    --chip-bg: #f0eae0;
    --panel: rgba(250, 247, 240, 0.94);
    --panel-text: #3a352d;
    --motif: rgba(58, 53, 45, 0.10);
    --focus: #6f8065;

    --display: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, 'Times New Roman', serif;
    --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  :root[data-theme="dark"] {
    /* ---- The same page by lamplight ---- */
    --hair: #383129;
    --hair-strong: #4b4238;
    --sage: #8ea081;
    --clay: #c79a79;
    --ochre: #d5b57c;
    --slate: #8b97a3;

    --bg: #1a1713;
    --bg-2: #14120f;
    --card: #241f1a;
    --card-2: #1f1b16;
    --text: #e8dfcd;
    --muted: #a19784;
    --title: #ece4d3;
    --subtitle: #a19784;

    --cell-border: #3b342b;
    --cell-border-filled: #6a5f50;
    --cell-bg: #201c17;
    --cell-text: #e8dfcd;

    --key-bg: #2b251e;
    --key-bg-hover: #362f26;
    --key-text: #e8dfcd;

    --correct: #6f8065;
    --present: #b08f52;
    --absent: #57503f;
    --on-correct: #f4f0e4;
    --on-present: #211d15;
    --on-absent: #cbc1ab;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.38);
    --shadow-lift: 0 14px 40px rgba(0, 0, 0, 0.5);
    --modal-overlay: rgba(10, 8, 6, 0.62);
    --modal-bg: #241f1a;
    --bar-bg: #2b251e;
    --chip-bg: #2b251e;
    --panel: rgba(36, 31, 26, 0.95);
    --panel-text: #e8dfcd;
    --motif: rgba(232, 223, 205, 0.09);
    --focus: #8ea081;
  }

  * { box-sizing: border-box; }
  /* An author `display` rule beats the UA stylesheet's [hidden] rule, so make
     the attribute authoritative — #distribution is display:flex. */
  [hidden] { display: none !important; }
  html { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; min-height: 100vh; min-height: 100dvh; }

  body {
    /* Vertical scroll stays available as a safety net on short screens;
       horizontal scroll is suppressed above. */
    font-family: var(--body);
    font-weight: 500;
    background-color: var(--bg);
    /* A still wash rather than a pattern: two soft pools of light on paper. */
    background-image:
      radial-gradient(ellipse 90% 60% at 50% -10%, var(--card-2) 0%, transparent 70%),
      radial-gradient(ellipse 70% 50% at 12% 108%, var(--bg-2) 0%, transparent 70%);
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--text);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .prop-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
    color: var(--motif);
  }

  .game {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 760px;
    background: var(--card);
    border: var(--line) solid var(--hair);
    border-radius: 18px;
    padding: 22px 26px 20px;
    box-shadow: var(--shadow);
    text-align: center;
    /* Kills accidental double-tap zoom while tapping out a word. Pinch zoom
       still works, so this doesn't cost anyone their zoom. */
    touch-action: manipulation;
  }

  /* ---- Top bar ---- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .topbar h1 {
    flex: 0 0 100%;
    order: -1;
    text-align: center;
    margin: 0 0 6px;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(26px, 4.2vw, 42px);
    line-height: 1.14;
    letter-spacing: 0.4px;
    color: var(--title);
  }
  .action-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .pill-btn, .pill-ghost {
    border: var(--line) solid var(--hair-strong);
    border-radius: 999px;
    padding: 9px 16px;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    touch-action: manipulation;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .pill-btn { background: var(--sage); color: var(--on-correct); border-color: var(--sage); }
  /* Modules sits with Found rather than competing with New Word. */
  #topics-btn { background: transparent; color: var(--text); border-color: var(--hair-strong); }
  #topics-btn:hover { background: var(--chip-bg); }
  .pill-ghost { background: transparent; color: var(--text); }
  .pill-btn:hover { background: #5f7057; border-color: #5f7057; }
  .pill-ghost:hover { background: var(--chip-bg); }
  .pill-btn:active, .pill-ghost:active, .icon-btn:active { transform: translateY(1px); }
  .pill-btn svg, .pill-ghost svg { display: block; }

  .icon-btn {
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: var(--line) solid var(--hair-strong);
    color: var(--muted);
    cursor: pointer;
    padding: 0;
    border-radius: 50%;
    touch-action: manipulation;
    transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease;
    font-family: inherit;
  }
  .icon-btn:hover { background: var(--chip-bg); color: var(--text); }
  .icon-btn svg { display: block; }
  :root[data-theme="dark"] .icon-sun  { display: block; }
  :root[data-theme="dark"] .icon-moon { display: none; }
  :root:not([data-theme="dark"]) .icon-sun  { display: none; }
  :root:not([data-theme="dark"]) .icon-moon { display: block; }

  .subtitle {
    margin: 8px 0 8px;
    font-size: 12px;
    color: var(--subtitle);
    letter-spacing: 1.6px;
    text-transform: uppercase;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    flex-wrap: wrap;
  }
  /* The subtitle's length chip is a button: it opens the picker. */
  .len-chip {
    background: var(--chip-bg);
    border: var(--line) solid var(--hair);
    color: var(--muted);
    border-radius: 999px;
    padding: 3px 11px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.9px;
    text-transform: uppercase;
    font-family: inherit;
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .len-chip:hover { background: var(--bar-bg); color: var(--text); }
  .len-chip .pin { color: var(--sage); }

  #message {
    min-height: 24px;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.6px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  /* ---- Board ----
     Tile size is derived from the answer's length (--cols), the number of
     tries (--rows) and the live viewport, so a 4x6 board and an 8x8 board
     both land above the keyboard without measuring anything in JS.
     Media queries below only ever retune the four knobs. */
  #board {
    --cols: 5;          /* letters in the answer  (set by JS) */
    --rows: 6;          /* guesses allowed        (set by JS) */
    --gap: 7px;
    --wpad: 66px;       /* page chrome either side of the board */
    --vb: 46;           /* share of viewport height the board may use, in % */
    --cap: 66px;        /* largest a tile ever gets */
    --floor: 30px;      /* smallest a tile gets; below this the page scrolls */
    --vbudget: calc(var(--vb) * 1vh);
    --cell: max(var(--floor), min(
      calc((100vw - var(--wpad) - (var(--cols) - 1) * var(--gap)) / var(--cols)),
      calc((var(--vbudget) - (var(--rows) - 1) * var(--gap)) / var(--rows)),
      var(--cap)
    ));
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    align-items: center;
    margin: 0 auto 16px;
  }
  .row {
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--cell));
    gap: var(--gap);
  }
  .cell {
    width: var(--cell);
    height: var(--cell);
    border: var(--line) solid var(--cell-border);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--display);
    font-weight: 400;
    font-size: calc(var(--cell) * 0.56);
    line-height: 1;
    text-transform: uppercase;
    background: var(--cell-bg);
    color: var(--cell-text);
    transition: border-color 0.25s ease, background 0.25s ease, color 0.25s ease;
  }
  /* Safari's toolbar shrinks the visible viewport; dvh follows it, vh doesn't. */
  @supports (height: 1dvh) {
    #board { --vbudget: calc(var(--vb) * 1dvh); }
  }
  .cell.filled {
    border-color: var(--cell-border-filled);
    animation: settle 0.22s ease;
  }
  @keyframes settle { 0% { transform: scale(0.94); opacity: 0.6; } 100% { transform: scale(1); opacity: 1; } }
  .cell.flip { animation: flip 0.55s ease forwards; }
  @keyframes flip {
    0%   { transform: rotateX(0); }
    50%  { transform: rotateX(88deg); }
    100% { transform: rotateX(0); }
  }
  .cell.correct { background: var(--correct); border-color: var(--correct); color: var(--on-correct); }
  .cell.present { background: var(--present); border-color: var(--present); color: var(--on-present); }
  .cell.absent  { background: var(--absent);  border-color: var(--absent);  color: var(--on-absent); }

  /* A short, soft nudge: enough to read as a rejection, no more. */
  .row.shake { animation: nudge 0.42s ease; }
  @keyframes nudge {
    20% { transform: translateX(-3px); }
    45% { transform: translateX(3px); }
    70% { transform: translateX(-2px); }
    100% { transform: translateX(0); }
  }

  .row.win-bounce .cell { animation: lift 0.9s ease var(--d, 0s); }
  @keyframes lift {
    0%, 15%   { transform: translateY(0); }
    45%       { transform: translateY(-9px); }
    100%      { transform: translateY(0); }
  }

  #keyboard {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin: 0 auto;
    max-width: 620px;
  }
  .kb-row { display: flex; justify-content: center; gap: 5px; }
  .key {
    flex: 1;
    min-width: 0;
    height: 54px;
    padding: 0 4px;
    border: var(--line) solid var(--hair);
    border-radius: 7px;
    background: var(--key-bg);
    color: var(--key-text);
    font-family: inherit;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 0.5px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.12s ease;
    touch-action: manipulation;
  }
  .key.wide { flex: 1.7; font-size: 11px; letter-spacing: 1px; }
  .key:hover { background: var(--key-bg-hover); }
  .key:active { transform: translateY(1px); }
  .key.correct { background: var(--correct); border-color: var(--correct); color: var(--on-correct); }
  .key.present { background: var(--present); border-color: var(--present); color: var(--on-present); }
  .key.absent  { background: var(--absent);  border-color: var(--absent);  color: var(--on-absent); }

  /* ---- Quiet motifs (a few drift in at the edges after each guess) ---- */
  .edge-prop {
    position: absolute;
    opacity: 0;
    animation: drift 5.4s ease-in-out forwards;
    will-change: transform, opacity;
  }
  @keyframes drift {
    0%   { opacity: 0; transform: translateY(10px) rotate(var(--rot, 0deg)) scale(0.96); }
    22%  { opacity: 1; }
    72%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-14px) rotate(var(--rot, 0deg)) scale(1); }
  }
  .edge-prop svg { width: 100%; height: 100%; display: block; }

  /* ---- End-of-game takeover ---- */
  #win-overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    display: none;
    overflow: hidden;
    color: var(--motif);
  }
  #win-overlay.active { display: block; }
  /* A soft scrim so the panel reads without the board shouting through it. */
  #win-overlay.active::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--bg);
    opacity: 0;
    animation: scrim 0.9s ease forwards;
  }
  @keyframes scrim { to { opacity: 0.82; } }

  .win-prop {
    position: absolute;
    opacity: 0;
    will-change: transform, opacity;
    animation:
      motifIn 1.6s var(--grow-delay, 0ms) ease forwards,
      motifOut 1.4s var(--retract-delay, 3200ms) ease forwards;
  }
  .win-prop svg { width: 100%; height: 100%; display: block; }
  @keyframes motifIn {
    0%   { opacity: 0; transform: translateY(14px) rotate(var(--rot, 0deg)) scale(0.94); }
    100% { opacity: 1; transform: translateY(0) rotate(var(--rot, 0deg)) scale(1); }
  }
  @keyframes motifOut {
    0%   { opacity: 1; transform: translateY(0) rotate(var(--rot, 0deg)) scale(1); }
    100% { opacity: 0; transform: translateY(-16px) rotate(var(--rot, 0deg)) scale(1.02); }
  }

  .win-message {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.9s ease, transform 0.9s ease;
    z-index: 11;
    pointer-events: none;
    padding: 0 16px;
  }
  .win-message.show { opacity: 1; transform: translateY(0); }
  .win-panel {
    background: var(--panel);
    border: var(--line) solid var(--hair);
    border-radius: 16px;
    padding: 26px 34px;
    box-shadow: var(--shadow-lift);
    max-width: calc(100vw - 32px);
    color: var(--panel-text);
  }
  .win-panel .line1 {
    font-family: var(--display);
    font-weight: 400;
    font-style: italic;
    color: var(--title);
    font-size: clamp(26px, 4.8vw, 44px);
    line-height: 1.16;
    letter-spacing: 0.3px;
  }
  .win-panel .line2 {
    color: var(--text);
    font-size: clamp(19px, 3.6vw, 34px);
    font-family: var(--display);
    font-weight: 400;
    letter-spacing: 6px;
    margin-top: 14px;
  }
  .win-panel .line3 {
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    margin-top: 10px;
  }

  .win-actions {
    position: absolute;
    left: 50%;
    bottom: calc(9% + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(8px);
    display: flex;
    gap: 10px;
    padding: 10px 12px;
    background: var(--panel);
    border: var(--line) solid var(--hair);
    border-radius: 999px;
    box-shadow: var(--shadow);
    opacity: 0;
    transition: opacity 0.7s ease, transform 0.7s ease;
    z-index: 12;
    pointer-events: auto;
  }
  .win-actions.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .win-btn {
    padding: 11px 22px;
    background: transparent;
    color: var(--text);
    border: var(--line) solid var(--hair-strong);
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    white-space: nowrap;
    flex: 0 0 auto;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .win-btn.alt { background: var(--sage); border-color: var(--sage); color: var(--on-correct); }
  .win-btn:hover { background: var(--chip-bg); }
  .win-btn.alt:hover { background: #5f7057; }
  .win-btn:active { transform: translateY(1px); }

  /* ---- Modals ---- */
  .modal { position: fixed; inset: 0; z-index: 100; display: none; }
  .modal.active { display: block; }
  .modal-backdrop { position: absolute; inset: 0; background: var(--modal-overlay); }
  .modal-card {
    position: relative;
    margin: calc(20px + env(safe-area-inset-top)) auto calc(20px + env(safe-area-inset-bottom));
    max-width: 620px;
    width: calc(100% - 32px);
    max-height: calc(100dvh - 40px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    background: var(--modal-bg);
    color: var(--text);
    border: var(--line) solid var(--hair);
    border-radius: 18px;
    padding: 28px 22px 24px;
    box-shadow: var(--shadow-lift);
  }
  /* Focused programmatically when the dialog opens; no ring needed for that. */
  .modal-card:focus { outline: none; }
  .modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    background: transparent;
    border: var(--line) solid var(--hair);
    cursor: pointer;
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    border-radius: 50%;
    touch-action: manipulation;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .modal-close:hover { background: var(--chip-bg); color: var(--text); }
  .modal h2 {
    margin: 0 0 6px;
    text-align: center;
    font-family: var(--display);
    font-weight: 400;
    font-size: 26px;
    letter-spacing: 0.3px;
    color: var(--title);
    padding: 0 30px;
  }
  .modal h3 {
    margin: 20px 0 10px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .modal-note {
    margin: 0 0 18px;
    text-align: center;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.4px;
    color: var(--muted);
  }

  /* Category picker */
  #topics-grid { display: flex; flex-direction: column; gap: 8px; }
  .cat-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 14px 15px;
    border: var(--line) solid var(--hair);
    border-radius: 12px;
    background: var(--cell-bg);
    color: var(--text);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }
  .cat-btn:hover { background: var(--chip-bg); }
  .cat-btn:active { transform: translateY(1px); }
  .cat-btn.active { border-color: var(--sage); background: var(--chip-bg); }
  .cat-btn.done .cat-prog { color: var(--sage); }
  /* Category glyphs: the same line motifs that drift behind the board. */
  .glyph { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; color: var(--muted); }
  .glyph svg { width: 100%; height: 100%; display: block; }
  .cat-icon { width: 26px; height: 26px; }
  .cat-btn.active .cat-icon { color: var(--sage); }
  .subtitle .glyph { width: 15px; height: 15px; }
  .found-head .glyph { width: 17px; height: 17px; margin-right: 7px; }
  .pick .glyph { width: 20px; height: 20px; margin: 0 auto; }
  .pick.on .glyph { color: var(--sage); }
  .cat-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .cat-name {
    font-family: var(--display);
    font-weight: 400;
    font-size: 18px;
    letter-spacing: 0.2px;
    color: var(--title);
  }
  .cat-hint { font-size: 12px; font-weight: 500; font-style: italic; color: var(--muted); }
  .cat-prog { font-size: 11px; font-weight: 600; letter-spacing: 0.7px; color: var(--muted); text-transform: uppercase; }

  /* Length picker + stats scope switcher share the same pill-row look.
     Each lays out as "one wide pill across the top, then an even row" so the
     last option never wraps onto a ragged second line. */
  /* Column counts are set in JS from the number of options, so adding a
     category or a new word length can't leave a ragged trailing row. */
  .pick-row { display: grid; gap: 6px; justify-items: stretch; }
  #length-grid { grid-template-columns: repeat(5, 1fr); }
  #stats-scope-grid { grid-template-columns: repeat(6, 1fr); }
  .pick:disabled { opacity: 0.35; cursor: not-allowed; }
  .pick-row .pick.wide { grid-column: 1 / -1; }
  .pick {
    min-width: 0;
    min-height: 42px;
    padding: 7px 4px;
    border: var(--line) solid var(--hair);
    border-radius: 999px;
    background: var(--cell-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    line-height: 1.15;
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }
  .pick.wide { text-transform: uppercase; font-size: 11.5px; letter-spacing: 1.2px; }
  .pick:hover:not(:disabled) { background: var(--chip-bg); }
  .pick:active:not(:disabled) { transform: translateY(1px); }
  .pick.on { background: var(--chip-bg); border-color: var(--sage); color: var(--text); }
  .pick .sub { display: block; font-size: 9px; letter-spacing: 0.4px; color: var(--muted); margin-top: 2px; font-weight: 500; }
  .pick-note {
    margin: 10px 0 0;
    font-size: 11.5px;
    font-weight: 500;
    text-align: center;
    color: var(--muted);
    line-height: 1.4;
  }

  /* Found words */
  .found-section {
    border: var(--line) solid var(--hair);
    border-radius: 12px;
    padding: 12px 13px;
    margin-bottom: 9px;
    background: var(--cell-bg);
  }
  .found-section.current { border-color: var(--hair-strong); }
  .found-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 13.5px;
    margin-bottom: 10px;
    letter-spacing: 0.3px;
  }
  .found-count {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.6px;
    color: var(--muted);
    background: var(--chip-bg);
    border: var(--line) solid var(--hair);
    padding: 2px 9px;
    border-radius: 999px;
    flex: 0 0 auto;
  }
  .found-count.done { background: var(--correct); border-color: var(--correct); color: var(--on-correct); }
  .len-group { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .len-tag {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--muted);
    min-width: 14px;
    flex: 0 0 auto;
    letter-spacing: 0.5px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 1.1px;
    padding: 4px 8px;
    border-radius: 5px;
    border: var(--line) solid var(--hair);
  }
  .chip.got { background: var(--correct); border-color: var(--correct); color: var(--on-correct); }
  .chip.locked { background: var(--bar-bg); color: var(--muted); }

  /* Stats */
  .stats-numbers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .stat { text-align: center; padding: 6px 2px; }
  .stat-num {
    font-family: var(--display);
    font-weight: 400;
    font-size: 30px;
    color: var(--title);
    line-height: 1.1;
  }
  .stat-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-top: 4px; line-height: 1.25; font-weight: 600; }

  #distribution { display: flex; flex-direction: column; gap: 4px; margin-bottom: 18px; }
  .dist-row {
    display: grid;
    grid-template-columns: 16px 1fr;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }
  .dist-bar {
    background: var(--bar-bg);
    border: var(--line) solid var(--hair);
    height: 22px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 8px;
    color: var(--text);
    min-width: 26px;
    font-size: 11.5px;
    transition: width 0.7s ease;
  }
  .dist-bar.highlight { background: var(--correct); border-color: var(--correct); color: var(--on-correct); }
  .stats-scope {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    text-align: center;
    margin: 12px 0 14px;
    color: var(--muted);
    min-height: 15px;
  }
  .stats-empty { text-align: center; font-size: 12px; font-weight: 500; color: var(--muted); margin: 0 0 18px; }
  .share-btn {
    display: block;
    margin: 4px auto 0;
    padding: 12px 30px;
    background: var(--sage);
    color: var(--on-correct);
    border: var(--line) solid var(--sage);
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.9px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
    touch-action: manipulation;
  }
  .share-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .share-btn:not(:disabled):hover { background: #5f7057; }
  .share-btn:not(:disabled):active { transform: translateY(1px); }

  .footer-note {
    margin: 16px 0 0;
    font-family: var(--display);
    font-style: italic;
    font-size: 12.5px;
    font-weight: 400;
    letter-spacing: 0.3px;
    color: var(--muted);
  }

  /* ---- Responsiveness: phone-first, then trims for short windows ---- */

  /* Laptop-height windows: trim the chrome so the keyboard stays in view
     even for an 8x8 board. */
  @media (min-width: 621px) and (max-height: 900px) {
    .topbar h1 { font-size: clamp(24px, 3.4vw, 34px); }
    #board { --vb: 42; --cap: 56px; }
    .key { height: 48px; font-size: 16px; }
    .footer-note { display: none; }
  }

  @media (max-width: 620px) {
    body {
      align-items: flex-start;
      padding: calc(6px + env(safe-area-inset-top))
               calc(7px + env(safe-area-inset-right))
               calc(8px + env(safe-area-inset-bottom))
               calc(7px + env(safe-area-inset-left));
    }
    .game { padding: 13px 11px 14px; border-radius: 15px; }
    .topbar { gap: 6px; }
    .topbar h1 { font-size: clamp(22px, 6.4vw, 32px); margin-bottom: 4px; }
    .pill-btn, .pill-ghost { padding: 8px 12px; font-size: 11.5px; gap: 5px; }
    .icon-btn { width: 36px; height: 36px; }
    /* Collapse secondary labels so the action bar stays one row. */
    #topics-btn .btn-label, #found-btn .btn-label { display: none; }
    #topics-btn, #found-btn { padding: 8px 10px; }
    .subtitle { font-size: 10.5px; letter-spacing: 1.1px; margin: 6px 0 5px; gap: 6px; }
    .len-chip { font-size: 10px; padding: 2px 8px; }
    #message { min-height: 19px; font-size: 12.5px; margin-bottom: 4px; }
    #board { --gap: 5px; --wpad: 36px; --vb: 50; --cap: 58px; margin-bottom: 12px; }
    #keyboard { gap: 6px; }
    .kb-row { gap: 4px; }
    .key { height: 50px; font-size: 16px; border-radius: 6px; }
    .key.wide { font-size: 10px; }
    .modal-card { padding: 26px 15px 20px; width: calc(100% - 20px); }
    .modal h2 { font-size: 22px; padding: 0 26px; }
    .cat-icon { width: 22px; height: 22px; }
    .cat-name { font-size: 16px; }
    .footer-note { display: none; }
  }
  /* iPhone SE / mini-class heights. */
  @media (max-width: 620px) and (max-height: 780px) {
    #board { --vb: 45; --cap: 54px; }
    .key { height: 45px; }
  }
  @media (max-width: 620px) and (max-height: 680px) {
    #board { --vb: 43; --cap: 48px; }
    .key { height: 40px; font-size: 15px; }
    .topbar h1 { font-size: clamp(19px, 5.8vw, 27px); }
  }
  /* Any short viewport — landscape phone, small desktop window. Keyed on
     height alone, since a landscape iPhone is wider than the phone breakpoint. */
  @media (max-height: 560px) {
    body { align-items: flex-start; padding-top: calc(5px + env(safe-area-inset-top)); }
    .game { padding: 10px 14px 10px; }
    .topbar h1 { font-size: clamp(19px, 3.2vw, 27px); }
    .subtitle { margin: 4px 0 4px; font-size: 10.5px; }
    #message { min-height: 17px; font-size: 12px; margin-bottom: 3px; }
    #board { --vb: 42; --cap: 40px; --floor: 26px; margin-bottom: 8px; }
    #keyboard { gap: 5px; }
    .key { height: 34px; font-size: 14px; }
    .key.wide { font-size: 10px; }
    .footer-note { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
  <div class="prop-layer" id="prop-edge" aria-hidden="true"></div>

  <main class="game">
    <div class="topbar">
      <button id="retry" type="button" class="pill-btn">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        New Word
      </button>
      <h1>Set Down This</h1>
      <div class="action-bar">
        <button id="topics-btn" type="button" class="pill-btn" aria-label="Modules">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span class="btn-label">Modules</span>
        </button>
        <button id="found-btn" type="button" class="pill-ghost" aria-label="Found words">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span class="btn-label">Found</span>
        </button>
        <button id="theme-toggle" type="button" class="icon-btn" aria-label="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun"  viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <button id="stats-btn" type="button" class="icon-btn" aria-label="Statistics">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="12" width="4" height="8" rx="1"/><rect x="10" y="6" width="4" height="14" rx="1"/><rect x="16" y="9" width="4" height="11" rx="1"/></svg>

    <p class="subtitle" id="topic-label"></p>

  </main>

  <div id="win-overlay" aria-hidden="true"></div>

  <!-- Category picker -->
  <div id="topics-modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close="topics-modal"></div>
    <div class="modal-card" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="topics-title">
      <button type="button" class="modal-close" data-close="topics-modal" aria-label="Close">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <h2 id="topics-title">Choose a Module</h2>
      <p class="modal-note">HSC English Advanced &middot; prescribed texts</p>
      <div id="topics-grid"></div>
      <h3>Word Length</h3>
      <div id="length-grid" class="pick-row"></div>
      <p class="pick-note" id="length-note"></p>
